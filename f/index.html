<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<!-- Everything a shared folder needs is in the fragment (#<id>.<key>),
     which the browser never sends here. The page fetches the encrypted
     folder from the share function and decrypts it in this tab. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://ddzcgaykvggbyvxlmawn.supabase.co https://cparusgxeqqqqkoygesi.supabase.co; base-uri 'none'; form-action 'none'">
<title>A folder shared from Desktop</title>
<meta name="description" content="Someone shared a folder of saves with you on Desktop.">
<meta name="apple-itunes-app" content="app-id=6815962690">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Desktop">
<meta property="og:title" content="A folder shared from Desktop">
<meta property="og:description" content="Tap to see what's inside.">
<meta property="og:image" content="https://arkive.tech/f/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#101014">
<link rel="stylesheet" href="share.css">
<script src="share.js" defer></script>
</head>
<body>
<div class="wallpaper" aria-hidden="true"></div>

<main>
  <header class="folder" id="folder" hidden>
    <div class="glyph" id="glyph" aria-hidden="true"></div>
    <h1 id="name"></h1>
    <p class="meta" id="meta"></p>
  </header>

  <p class="status" id="status" role="status">Opening folder…</p>

  <section class="grid" id="grid" aria-label="Saves in this folder"></section>

  <p class="note" id="note" hidden></p>
</main>

<footer class="cta">
  <img class="wordmark" src="wordmark.png" alt="Desktop" width="105" height="40">
  <p>Save anything from any app. Desktop sorts it for you.</p>
  <a class="button" href="https://apps.apple.com/app/id6815962690">Get Desktop on the App Store</a>
  <p class="small">Already have Desktop? Open this link again from Messages to add the folder.</p>
</footer>
</body>
</html>
